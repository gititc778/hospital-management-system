name: appointment-api
replicas: 1

image:
  repository: dockeritc778/appointment-api
  tag: v1.1.4

containerPort: 3001

service:
  type: NodePort
  port: 3001

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# DB settings. Set create: false and name: hpm-config / hpm-secret
# to use the shared resources from config/ instead.
configMap:
  create: true
  name: appointment-api-config
  data:
    DB_HOST: mysql
    DB_NAME: hospital

secret:
  create: true
  name: appointment-api-secret
  data:
    DB_USER: user
    DB_PASSWORD: pass123
