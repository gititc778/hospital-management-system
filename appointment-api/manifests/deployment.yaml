apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: appointment-api

  template:
    metadata:
      labels:
        app: appointment-api

    spec:
      containers:
        - name: appointment-api
          image: dockeritc778/appointment-api:v1.1.0
          ports:
            - containerPort: 3001

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: hpm-config

            - secretRef:
                name: hpm-secret