apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-frontend-ingress
spec:
  ingressClassName: nginx

  rules:
    - host: hpm.itclabs.live
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospital-frontend
                port:
                  number: 80