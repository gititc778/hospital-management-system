server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve API hostnames per request instead of at startup,
    # so the UI still loads when the APIs are not deployed yet.
    # NGINX_RESOLVER and K8S_DNS_SUFFIX are set by 15-k8s-dns.envsh
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/patients {
        set $patient_api patient-api${K8S_DNS_SUFFIX};
        rewrite ^/api/patients(.*)$ /patients$1 break;
        proxy_pass http://$patient_api:3000;
    }

    location /api/appointments {
        set $appointment_api appointment-api${K8S_DNS_SUFFIX};
        rewrite ^/api/appointments(.*)$ /appointments$1 break;
        proxy_pass http://$appointment_api:3001;
    }

    error_page 404 /index.html;
}
