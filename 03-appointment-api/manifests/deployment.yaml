apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: appointment-api

  template:
    metadata:
      labels:
        app: appointment-api

    spec:
      containers:
        - name: appointment-api
          image: dockeritc778/appointment-api:v1.1.4

          ports:
            - containerPort: 3001

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Checks if the Flask application is alive
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Checks if Flask can connect to MySQL
          readinessProbe:
            httpGet:
              path: /readiness
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: hpm-config

            - secretRef:
                name: hpm-secret