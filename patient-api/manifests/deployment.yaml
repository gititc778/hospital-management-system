apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: patient-api

  template:
    metadata:
      labels:
        app: patient-api

    spec:
      containers:
        - name: patient-api
          image: dockeritc778/patient-api:v1.1.0

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: hpm-config

            - secretRef:
                name: hpm-secret