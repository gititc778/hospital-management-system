apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: hospital-frontend

  template:
    metadata:
      labels:
        app: hospital-frontend

    spec:
      containers:
        - name: hospital-frontend
          image: dockeritc778/hpm:v1.1.0

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"